<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه‌ساز پایانه فروشگاهی مهستان</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, 'B Nazanin', sans-serif; }
        body {
            background-color: #1a2f32;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .pos-device {
            background-color: #2b353a;
            border: 4px solid #1c2326;
            border-radius: 28px;
            width: 360px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .pos-brand {
            font-size: 13px;
            color: #78909c;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .pos-screen {
            background-color: #e0f2f1;
            color: #102a2d;
            border-radius: 12px;
            width: 100%;
            padding: 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .screen-header {
            font-size: 11px;
            font-weight: bold;
            color: #004d40;
            border-bottom: 1px dashed #80cbc4;
            padding-bottom: 6px;
            text-align: center;
        }
        .input-group {
            margin-top: 10px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #004d40;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .pos-screen input {
            width: 100%;
            padding: 8px;
            border: 1px solid #80cbc4;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            outline: none;
            direction: ltr;
        }
        .screen-msg {
            font-size: 12px;
            line-height: 1.6;
            margin: 8px 0;
            text-align: center;
        }
        .btn-action {
            background-color: #00796b;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            font-size: 13px;
        }
        .btn-action:hover { background-color: #004d40; }
        .btn-swipe {
            background-color: #d32f2f;
            display: none;
        }
        .btn-swipe:hover { background-color: #b71c1c; }
        
        /* پرینتر و فیش حرارتی */
        .paper-slot {
            width: 220px;
            height: 8px;
            background-color: #151a1c;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .receipt-container {
            width: 260px;
            background: #ffffff;
            color: #111;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #bbb;
            border-bottom: 4px solid #bbb;
            animation: printEffect 1.2s ease-out;
        }
        @keyframes printEffect {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .receipt-title {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .receipt-row.bold { font-weight: bold; }
        .receipt-footer {
            border-top: 1px dashed #333;
            margin-top: 10px;
            padding-top: 8px;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="paper-slot"></div>

    <!-- بدنه کارتخوان -->
    <div class="pos-device">
        <div class="pos-brand">SAMAN KISH • MAHESTAN POS</div>
        
        <div class="pos-screen" id="posScreen">
            <div class="screen-header">باشگاه مشتریان پاساژ مهستان (پوشاک زاگرس)</div>
            
            <div id="stepInputs">
                <div class="input-group">
                    <label>شماره موبایل مشتری:</label>
                    <input type="text" id="posMobile" placeholder="09xxxxxxxxx" value="09121111111" maxlength="11">
                </div>
                <div class="input-group">
                    <label>مبلغ کل خرید (ریال):</label>
                    <input type="number" id="posAmount" placeholder="مثلاً 1000000" value="1000000">
                </div>
                <button class="btn-action" onclick="handleInquiry()">استعلام تخفیف و محاسبه</button>
            </div>

            <div id="stepSwipe" style="display: none;">
                <div class="screen-msg" id="inquiryInfo"></div>
                <button class="btn-action btn-swipe" id="swipeBtn" style="display: block;" onclick="handlePayment()">💳 کشیدن کارت بانکی و پرداخت</button>
            </div>
        </div>
    </div>

    <!-- فیش حرارتی پرینت‌شده -->
    <div class="receipt-container" id="thermalReceipt">
        <div class="receipt-title">باشگاه مشتریان مرکز خرید مهستان</div>
        <div class="receipt-row"><span>فروشگاه:</span><span>پوشاک زاگرس</span></div>
        <div class="receipt-row"><span>شماره مشتری:</span><span id="rcpMobile">-</span></div>
        <div class="receipt-row"><span>مبلغ کل فاکتور:</span><span id="rcpOriginal">-</span></div>
        <div class="receipt-row"><span>تخفیف باشگاه:</span><span id="rcpDiscount">-</span></div>
        <div class="receipt-row bold"><span>مبلغ کسرشده شاپرک:</span><span id="rcpPayable">-</span></div>
        <div class="receipt-row"><span>شماره پیگیری (RRN):</span><span id="rcpRrn">-</span></div>
        <div class="receipt-footer">
            <div id="rcpCashback" style="font-weight: bold; margin-bottom: 4px;"></div>
            <div>با تشکر از خرید شما</div>
        </div>
    </div>
</div>

<script>
    let currentInquiryData = null;

    async function handleInquiry() {
        const mobile = document.getElementById('posMobile').value.trim();
        const amount = parseInt(document.getElementById('posAmount').value);

        if (!mobile || !amount) {
            alert('لطفاً شماره موبایل و مبلغ را به درستی وارد کنید.');
            return;
        }

        try {
            const res = await fetch('/api/pos/inquiry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mobile: mobile,
                    terminal_id: "11112222",
                    amount: amount
                })
            });

            if (!res.ok) {
                const err = await res.json();
                alert(err.detail || 'خطا در ارتباط با سرور');
                return;
            }

            currentInquiryData = await res.json();

            // تغییر وضعیت صفحه پوز
            document.getElementById('stepInputs').style.display = 'none';
            document.getElementById('stepSwipe').style.display = 'block';

            const discount = currentInquiryData.discount_amount;
            const payable = currentInquiryData.payable_amount;

            document.getElementById('inquiryInfo').innerHTML = `
                <div>مبلغ کل: <b>${amount.toLocaleString('fa-IR')} ریال</b></div>
                <div style="color: #c62828;">تخفیف گردونه/باشگاه: <b>${discount.toLocaleString('fa-IR')} ریال</b></div>
                <div style="font-size: 14px; margin-top: 8px; color: #004d40;">مبلغ قابل پرداخت: <br><b style="font-size: 17px;">${payable.toLocaleString('fa-IR')} ریال</b></div>
            `;
        } catch (e) {
            console.error(e);
            alert('خطای اتصال به شبکه');
        }
    }

    async function handlePayment() {
        const fakeRrn = Math.floor(100000000000 + Math.random() * 900000000000).toString();
        const mobile = document.getElementById('posMobile').value.trim();

        try {
            const res = await fetch('/api/pos/settle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mobile: mobile,
                    terminal_id: "11112222",
                    paid_amount: currentInquiryData.payable_amount,
                    rrn: fakeRrn
                })
            });

            const settleData = await res.json();

            // چاپ رسید
            document.getElementById('rcpMobile').innerText = mobile;
            document.getElementById('rcpOriginal').innerText = currentInquiryData.original_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpDiscount').innerText = currentInquiryData.discount_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpPayable').innerText = currentInquiryData.payable_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpRrn').innerText = fakeRrn;
            document.getElementById('rcpCashback').innerText = settleData.pos_message;

            document.getElementById('thermalReceipt').style.display = 'block';

            // ریست صفحه پوز به حالت اولیه برای تراکنش بعدی بعد از ۳ ثانیه
            setTimeout(() => {
                document.getElementById('stepInputs').style.display = 'block';
                document.getElementById('stepSwipe').style.display = 'none';
            }, 3000);

        } catch (e) {
            console.error(e);
            alert('خطا در تسویه حساب شاپرک');
        }
    }
</script>

</body>
</html>
