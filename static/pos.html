<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه‌ساز پایانه فروشگاهی مهستان</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, 'B Nazanin', sans-serif; }
        body {
            background-color: #1a2f32;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .pos-device {
            background-color: #2b353a;
            border: 4px solid #1c2326;
            border-radius: 28px;
            width: 360px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pos-brand {
            font-size: 13px;
            color: #78909c;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .pos-screen {
            background-color: #e0f2f1;
            color: #102a2d;
            border-radius: 12px;
            width: 100%;
            padding: 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .screen-header {
            font-size: 12px;
            font-weight: bold;
            color: #004d40;
            border-bottom: 1px dashed #80cbc4;
            padding-bottom: 6px;
            text-align: center;
        }
        .input-group { margin-top: 8px; }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #004d40;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .pos-screen input, .pos-screen select {
            width: 100%;
            padding: 7px;
            border: 1px solid #80cbc4;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            outline: none;
            background: #fff;
            color: #000;
        }
        .screen-msg {
            font-size: 12px;
            line-height: 1.6;
            margin: 8px 0;
            text-align: center;
        }
        .btn-action {
            background-color: #00796b;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            font-size: 13px;
        }
        .btn-swipe { background-color: #d32f2f; }
        .btn-swipe:hover { background-color: #b71c1c; }
        
        .paper-slot {
            width: 220px;
            height: 8px;
            background-color: #151a1c;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .receipt-container {
            width: 270px;
            background: #ffffff;
            color: #111;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #bbb;
            border-bottom: 4px solid #bbb;
            animation: printEffect 1.2s ease-out;
        }
        @keyframes printEffect {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .receipt-title {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .receipt-row.bold { font-weight: bold; }
        .receipt-footer {
            border-top: 1px dashed #333;
            margin-top: 10px;
            padding-top: 8px;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="paper-slot"></div>

    <div class="pos-device">
        <div class="pos-brand">SAMAN KISH • MAHESTAN POS</div>
        
        <div class="pos-screen">
            <div class="screen-header">باشگاه مشتریان مرکز خرید مهستان</div>
            
            <div id="stepInputs">
                <div class="input-group">
                    <label>فروشگاه پذیرنده (پایانه):</label>
                    <select id="posTerminal">
                        <option value="45034950">رزتن (45034950)</option>
                        <option value="99031044">ماریوسونیک (99031044)</option>
                        <option value="9946922">لوکا (9946922)</option>
                        <option value="99225982">کاتوزیان (99225982)</option>
                        <option value="099034315">زیرو (099034315)</option>
                        <option value="45251385">طلای اکسین (45251385)</option>
                        <option value="99231122">دیپ لوک (99231122)</option>
                        <option value="99445302">کنزپلاس (99445302)</option>
                        <option value="99354094">چیلک (99354094)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>شماره موبایل مشتری:</label>
                    <input type="text" id="posMobile" placeholder="09xxxxxxxxx" value="09134533348" maxlength="11">
                </div>
                <div class="input-group">
                    <label>مبلغ کل فاکتور (ریال):</label>
                    <input type="number" id="posAmount" value="1000000">
                </div>
                <button class="btn-action" onclick="handleInquiry()">استعلام تخفیف</button>
            </div>

            <div id="stepSwipe" style="display: none;">
                <div class="screen-msg" id="inquiryInfo"></div>
                <button class="btn-action btn-swipe" onclick="handlePayment()">💳 کشیدن کارت و کسر وجه</button>
            </div>
        </div>
    </div>

    <div class="receipt-container" id="thermalReceipt">
        <div class="receipt-title">باشگاه مشتریان مرکز خرید مهستان</div>
        <div class="receipt-row"><span>فروشگاه:</span><span id="rcpStore">-</span></div>
        <div class="receipt-row"><span>شماره مشتری:</span><span id="rcpMobile">-</span></div>
        <div class="receipt-row"><span>مبلغ کل فاکتور:</span><span id="rcpOriginal">-</span></div>
        <div class="receipt-row"><span>تخفیف باشگاه:</span><span id="rcpDiscount">-</span></div>
        <div class="receipt-row bold"><span>مبلغ کسرشده شاپرک:</span><span id="rcpPayable">-</span></div>
        <div class="receipt-row"><span>شماره پیگیری (RRN):</span><span id="rcpRrn">-</span></div>
        <div class="receipt-footer">
            <div id="rcpCashback" style="font-weight: bold; margin-bottom: 4px;"></div>
            <div>با تشکر از خرید شما</div>
        </div>
    </div>
</div>

<script>
    let currentInquiryData = null;

    async function handleInquiry() {
        const terminal_id = document.getElementById('posTerminal').value;
        const mobile = document.getElementById('posMobile').value.trim();
        const amount = parseInt(document.getElementById('posAmount').value);

        if (!mobile || !amount) {
            alert('لطفاً اطلاعات را کامل وارد کنید.');
            return;
        }

        try {
            const res = await fetch('/api/pos/inquiry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile, terminal_id, amount })
            });

            currentInquiryData = await res.json();

            document.getElementById('stepInputs').style.display = 'none';
            document.getElementById('stepSwipe').style.display = 'block';

            document.getElementById('inquiryInfo').innerHTML = `
                <div>فروشگاه: <b>${currentInquiryData.store_name}</b></div>
                <div>مبلغ کل: <b>${amount.toLocaleString('fa-IR')} ریال</b></div>
                <div style="color: #c62828;">تخفیف کوپن: <b>${currentInquiryData.discount_amount.toLocaleString('fa-IR')} ریال</b></div>
                <div style="font-size: 14px; margin-top: 6px; color: #004d40;">مبلغ قابل کسر: <br><b style="font-size: 16px;">${currentInquiryData.payable_amount.toLocaleString('fa-IR')} ریال</b></div>
            `;
        } catch (e) {
            alert('خطای اتصال به سرور');
        }
    }

    async function handlePayment() {
        const terminal_id = document.getElementById('posTerminal').value;
        const fakeRrn = Math.floor(100000000000 + Math.random() * 900000000000).toString();
        const mobile = document.getElementById('posMobile').value.trim();

        try {
            const res = await fetch('/api/pos/settle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mobile: mobile,
                    terminal_id: terminal_id,
                    paid_amount: currentInquiryData.payable_amount,
                    rrn: fakeRrn
                })
            });

            const settleData = await res.json();

            document.getElementById('rcpStore').innerText = currentInquiryData.store_name;
            document.getElementById('rcpMobile').innerText = mobile;
            document.getElementById('rcpOriginal').innerText = currentInquiryData.original_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpDiscount').innerText = currentInquiryData.discount_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpPayable').innerText = currentInquiryData.payable_amount.toLocaleString('fa-IR') + ' ریال';
            document.getElementById('rcpRrn').innerText = fakeRrn;
            document.getElementById('rcpCashback').innerText = settleData.pos_message;

            document.getElementById('thermalReceipt').style.display = 'block';

            setTimeout(() => {
                document.getElementById('stepInputs').style.display = 'block';
                document.getElementById('stepSwipe').style.display = 'none';
            }, 3000);
        } catch (e) {
            alert('خطا در تسویه');
        }
    }
</script>

</body>
</html>
