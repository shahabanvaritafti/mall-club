<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس مرکز خرید مهستان</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, 'B Nazanin', sans-serif; }
        body {
            background: linear-gradient(135deg, #182d30, #0c181a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
        }
        .wheel-container {
            background-color: #1a2f32;
            border: 1px solid #376569;
            border-radius: 16px;
            padding: 20px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 { margin-top: 0; color: #80cbc4; font-size: 19px; }
        p { font-size: 12px; color: #b0bec5; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; text-align: right; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #cfd8dc; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #376569;
            background: #0f1c1e;
            color: #fff;
            font-size: 15px;
            text-align: center;
            outline: none;
            direction: ltr;
        }
        .canvas-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 15px auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.12, 0.95, 0.32, 1);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #fbc02d;
            z-index: 10;
        }
        .btn-spin {
            background-color: #4eb5a5;
            color: #0b1a1c;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-spin:disabled { background-color: #475a5c; cursor: not-allowed; }
        #resultMsg { margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 24px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="wheel-container">
    <h2>گردونه شانس مرکز خرید مهستان</h2>
    <p>شماره موبایل خود را وارد کرده و تخفیف ویژه فروشگاه‌ها را ببرید</p>

    <div class="input-group">
        <label for="mobileInput">شماره موبایل خریدار:</label>
        <input type="text" id="mobileInput" placeholder="09xxxxxxxxx" maxlength="11">
    </div>

    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="340" height="340"></canvas>
    </div>

    <button id="spinBtn" class="btn-spin" onclick="startSpin()">چرخش گردونه</button>
    <div id="resultMsg"></div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const mobileInput = document.getElementById('mobileInput');
    const resultMsg = document.getElementById('resultMsg');

    // فروشگاه‌های مهستان با تخفیف اختصاصی
    const segments = [
        { name: "رزتن", terminal_id: "45034950", percent: 10, color: "#1f4044" },
        { name: "ماریوسونیک", terminal_id: "99031044", percent: 12, color: "#29565c" },
        { name: "لوکا", terminal_id: "9946922", percent: 8, color: "#366e75" },
        { name: "کاتوزیان", terminal_id: "99225982", percent: 20, color: "#c98f1a" },
        { name: "زیرو", terminal_id: "099034315", percent: 5, color: "#22474b" },
        { name: "طلای اکسین", terminal_id: "45251385", percent: 2, color: "#8a7322" },
        { name: "دیپ لوک", terminal_id: "99231122", percent: 20, color: "#d69818" },
        { name: "کنزپلاس", terminal_id: "99445302", percent: 5, color: "#2e5e64" },
        { name: "چیلک", terminal_id: "99354094", percent: 5, color: "#3d7c85" }
    ];

    const numSegments = segments.length;
    const arc = (2 * Math.PI) / numSegments;
    let currentDegree = 0;
    let isSpinning = false;

    function drawWheel() {
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        segments.forEach((seg, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = seg.color;
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, angle, angle + arc);
            ctx.lineTo(radius, radius);
            ctx.fill();
            ctx.strokeStyle = "#102325";
            ctx.lineWidth = 2;
            ctx.stroke();

            // رسم عنوان مغازه و درصد
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 12px Tahoma";
            ctx.fillText(`${seg.name} (٪${seg.percent})`, radius - 15, 4);
            ctx.restore();
        });
    }

    drawWheel();

    async function startSpin() {
        const mobile = mobileInput.value.trim();
        if (!mobile || mobile.length < 10) {
            alert("لطفاً شماره موبایل را به درستی وارد کنید.");
            return;
        }

        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        resultMsg.innerText = "";

        const pickedIndex = Math.floor(Math.random() * numSegments);
        const prize = segments[pickedIndex];

        const segmentDeg = 360 / numSegments;
        const targetDeg = (360 - (pickedIndex * segmentDeg) - (segmentDeg / 2) + 270) % 360;
        const extraRounds = 5 * 360;
        currentDegree += extraRounds + (targetDeg - (currentDegree % 360) + 360) % 360;

        canvas.style.transform = `rotate(${currentDegree}deg)`;

        setTimeout(async () => {
            isSpinning = false;
            spinBtn.disabled = false;

            try {
                const response = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mobile: mobile,
                        discount_percent: prize.percent,
                        terminal_id: prize.terminal_id
                    })
                });

                if (response.ok) {
                    resultMsg.innerHTML = `<span style="color:#80cbc4;">تبریک! کوپن <b>${prize.percent}٪ تخفیف</b> فروشگاه <b>${prize.name}</b> برای شماره شما فعال گردید.</span>`;
                } else {
                    resultMsg.innerText = "خطا در ثبت کوپن تخفیف.";
                }
            } catch (err) {
                resultMsg.innerText = "خطای اتصال به سرور.";
                console.error(err);
            }
        }, 4000);
    }
</script>

</body>
</html>
