<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گردونه شانس باشگاه مشتریان مهستان</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, 'B Nazanin', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3638, #102123);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .wheel-container {
            background-color: #1a2f32;
            border: 1px solid #376569;
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #80cbc4; font-size: 20px; }
        p { font-size: 13px; color: #b0bec5; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 12px; margin-bottom: 6px; color: #cfd8dc; }
        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #376569;
            background: #0f1c1e;
            color: #fff;
            font-size: 14px;
            text-align: center;
            direction: ltr;
        }
        .canvas-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.35, 1);
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #fbc02d;
            z-index: 10;
        }
        .btn-spin {
            background-color: #4eb5a5;
            color: #0b1a1c;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-spin:disabled { background-color: #526e70; cursor: not-allowed; }
        #resultMsg { margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 22px; }
    </style>
</head>
<body>

<div class="wheel-container">
    <h2>گردونه شانس مرکز خرید مهستان</h2>
    <p>شماره موبایل خود را وارد کرده و گردونه را بچرخانید</p>

    <div class="input-group">
        <label for="mobileInput">شماره موبایل خریدار:</label>
        <input type="text" id="mobileInput" placeholder="09xxxxxxxxx" maxlength="11">
    </div>

    <div class="canvas-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" class="btn-spin" onclick="startSpin()">چرخش گردونه</button>
    <div id="resultMsg"></div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const mobileInput = document.getElementById('mobileInput');
    const resultMsg = document.getElementById('resultMsg');

    // آیتم‌های تخفیف روی گردونه
    const segments = [
        { label: "۵٪ تخفیف", percent: 5, color: "#1f4044" },
        { label: "۱۰٪ تخفیف", percent: 10, color: "#2d5d63" },
        { label: "۱۵٪ تخفیف", percent: 15, color: "#3b7a82" },
        { label: "۲۰٪ تخفیف", percent: 20, color: "#4eb5a5" },
        { label: "۵٪ تخفیف", percent: 5, color: "#1f4044" },
        { label: "۱۰٪ تخفیف", percent: 10, color: "#2d5d63" },
        { label: "۱۵٪ تخفیف", percent: 15, color: "#3b7a82" },
        { label: "۲۵٪ تخفیف", percent: 25, color: "#e0a926" }
    ];

    const numSegments = segments.length;
    const arc = (2 * Math.PI) / numSegments;
    let currentDegree = 0;
    let isSpinning = false;

    // رسم گردونه
    function drawWheel() {
        const radius = canvas.width / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        segments.forEach((seg, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = seg.color;
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, angle, angle + arc);
            ctx.lineTo(radius, radius);
            ctx.fill();
            ctx.stroke();

            // متن‌ها
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Tahoma";
            ctx.fillText(seg.label, radius - 20, 5);
            ctx.restore();
        });
    }

    drawWheel();

    async function startSpin() {
        const mobile = mobileInput.value.trim();
        if (!mobile || mobile.length < 10) {
            alert("لطفاً یک شماره موبایل معتبر وارد کنید.");
            return;
        }

        if (isSpinning) return;
        isSpinning = true;
        spinBtn.disabled = true;
        resultMsg.innerText = "";

        // انتخاب رندوم یک سگمنت
        const pickedIndex = Math.floor(Math.random() * numSegments);
        const prize = segments[pickedIndex];

        // محاسبه زاویه چرخش به طوری که سوزن بالا روی سگمنت موردنظر قرار گیرد
        // سوزن در زاویه 270 درجه (بالا) قرار دارد
        const segmentDeg = 360 / numSegments;
        const targetDeg = (360 - (pickedIndex * segmentDeg) - (segmentDeg / 2) + 270) % 360;
        const extraRounds = 5 * 360; // ۵ دور چرخش کامل برای شتاب بصری
        currentDegree += extraRounds + (targetDeg - (currentDegree % 360) + 360) % 360;

        // اجرای موشن چرخش
        canvas.style.transform = `rotate(${currentDegree}deg)`;

        // منتظر ماندن تا اتمام انیمیشن (۴ ثانیه طبق CSS)
        setTimeout(async () => {
            isSpinning = false;
            spinBtn.disabled = false;
            resultMsg.innerText = `تبریک! شما برنده ${prize.label} شدید. در حال ثبت...`;

            // ثبت کوپن در دیتابیس از طریق API
            try {
                const response = await fetch('/api/spin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mobile: mobile,
                        discount_percent: prize.percent,
                        terminal_id: "11112222"
                    })
                });

                const resData = await response.json();
                if (response.ok) {
                    resultMsg.innerText = `کوپن ${prize.percent}٪ با موفقیت برای شماره ${mobile} ثبت گردید.`;
                } else {
                    resultMsg.innerText = "خطا در ثبت کوپن: " + (resData.detail || "مشکل سرور");
                }
            } catch (err) {
                resultMsg.innerText = "ارتباط با سرور برقرار نشد.";
                console.error(err);
            }
        }, 4000);
    }
</script>

</body>
</html>
